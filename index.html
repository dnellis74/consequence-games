<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consequence Games</title>
  <meta name="description" content="Games where choices matter, and the dice fall where they may.">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://consequence.games/">
  <meta property="og:title" content="Consequence Games">
  <meta property="og:description" content="Games where choices matter, and the dice fall where they may.">
  <meta property="og:image" content="https://consequence.games/consequence_banner.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Consequence Games">
  <meta name="twitter:description" content="Games where choices matter, and the dice fall where they may.">
  <meta name="twitter:image" content="https://consequence.games/consequence_banner.png">
  <meta name="theme-color" content="#1b2a6b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;700;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#1b2a6b;
      --navy-dark:#121e4f;
      --ink:#1a1d2e;
      --muted:#5a6076;
      --line:#e6e8f0;
      --bg:#ffffff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:var(--bg);
      color:var(--ink);
      font-family: ui-sans-system, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      min-height:100svh;
      display:flex;
      flex-direction:column;
    }
    main{
      flex:1;
      width:100%;
      max-width:1120px;
      margin:0 auto;
      padding:clamp(20px,5vw,56px) clamp(18px,4vw,40px) 40px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    .logo{
      width:100%;
      max-width:1020px;
      height:auto;
      display:block;
      user-select:none;
    }
    .rule{
      width:56px;height:3px;border-radius:999px;
      background:var(--navy);
      margin:clamp(18px,3vw,28px) auto 18px;
      opacity:.9;
    }
    .eyebrow{
      font-family: "Silkscreen", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing:.04em;
      text-transform:uppercase;
      font-size:14px;
      font-weight:700;
      color:var(--navy);
      margin:0 0 18px;
      text-align:center;
    }
    .games{
      width:100%;
      max-width:760px;
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(min(100%, 320px), 1fr));
      gap:20px;
    }
    .card{
      display:flex;
      flex-direction:column;
      border:1px solid var(--line);
      border-radius:10px;
      overflow:hidden;
      text-decoration:none;
      color:inherit;
      background:#fff;
      transition:border-color .2s, transform .2s;
    }
    .card:hover, .card:focus-visible{
      border-color:var(--navy);
      transform:translateY(-2px);
      outline:none;
    }
    .thumb{
      position:relative;
      height:150px;
      background:
        radial-gradient(ellipse 70% 60% at 50% 40%, #0c2430 0%, transparent 60%),
        linear-gradient(165deg, #0a1c24 0%, #061018 45%, #02060c 100%);
    }
    .thumb .trail{
      position:absolute;
      left:22%; top:58%;
      width:44%; height:14px;
      border-radius:999px;
      background:linear-gradient(90deg, rgba(12,70,68,.2), rgba(80,240,210,.85));
      filter:blur(.5px);
      transform:rotate(-14deg);
      transform-origin:right center;
    }
    .thumb .head{
      position:absolute;
      left:64%; top:40%;
      width:30px; height:30px;
      border-radius:50%;
      background:radial-gradient(circle at 35% 30%, #e8fff9 0%, #7fffea 30%, #3ef0d0 60%, #148a78 90%);
      box-shadow:0 0 18px rgba(62,240,208,.7), 0 0 44px rgba(26,184,160,.4);
    }
    .thumb .you{
      position:absolute;
      left:82%; top:26%;
      width:12px; height:12px;
      border-radius:50%;
      border:1.5px solid rgba(127,255,234,.7);
    }
    .thumb.snail .slime{
      position:absolute;
      left:10%; top:66%;
      width:52%; height:8px;
      border-radius:999px;
      background:rgba(205,215,150,.55);
      box-shadow:0 0 10px rgba(205,215,150,.25);
      transform:rotate(-8deg);
    }
    .thumb.snail .shell{
      position:absolute;
      left:56%; top:44%;
      width:34px; height:34px;
      border-radius:50%;
      background:radial-gradient(circle at 35% 30%, #e9b86a 0%, #a8642a 60%, #5a2e12 100%);
      box-shadow:0 0 0 2px #3a1d08 inset;
    }
    .thumb.snail .coin{
      position:absolute;
      left:78%; top:30%;
      width:14px; height:14px;
      border-radius:50%;
      background:#f2c14e;
      box-shadow:0 0 10px rgba(255,210,90,.6);
    }
    .body{
      padding:16px 18px 18px;
    }
    .card h2{
      font-family: "Grenze Gotisch", "UnifrakturMaguntia", Georgia, serif;
      font-size:34px;
      line-height:1;
      margin:0 0 8px;
      color:var(--navy-dark);
      font-weight:700;
    }
    .card p{
      margin:0 0 14px;
      color:var(--muted);
      font-size:15.5px;
      line-height:1.5;
    }
    .play{
      font-family: "Silkscreen", ui-monospace, monospace;
      font-size:13px;
      color:var(--navy);
    }
    footer{
      border-top:1px solid var(--line);
      padding:18px 20px 22px;
      text-align:center;
      color:var(--muted);
      font-size:13.5px;
      line-height:1.5;
    }
    footer a{color:var(--navy);text-decoration:none;font-weight:600}
    footer a:hover{text-decoration:underline}
    @media (prefers-reduced-motion: reduce){
      .card{transition:none}
      .card:hover{transform:none}
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/consequence_banner.png" alt="Consequence Games — a giant die falling toward two startled adventurers opening a treasure chest" width="3603" height="1381">
    <div class="rule" aria-hidden="true"></div>
    <p class="eyebrow">Games</p>
    <div class="games">
      <a class="card" href="/snail">
        <div class="thumb snail" aria-hidden="true"><span class="slime"></span><span class="shell"></span><span class="coin"></span></div>
        <div class="body">
          <h2>Immortal Snail Assassin</h2>
          <p>A snail is after you. Loot makes you richer, and slower.</p>
          <span class="play">]play_</span>
        </div>
      </a>
    </div>
  </main>
  <footer>
    <a href="/">Games</a> &middot; <a href="/about">About</a> &middot; <a href="/links">Links</a> &middot; <a href="/contact">Contact</a> &middot; &copy; 2026 Consequence Games
  </footer>
</body>
</html>
