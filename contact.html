<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · Consequence Games</title>
  <meta name="description" content="Send a message to Consequence Games.">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://consequence.games/contact">
  <meta property="og:title" content="Contact · Consequence Games">
  <meta property="og:description" content="Send a message to Consequence Games.">
  <meta property="og:image" content="https://consequence.games/consequence_banner.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#1b2a6b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;700;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#1b2a6b;
      --navy-dark:#121e4f;
      --ink:#1a1d2e;
      --muted:#5a6076;
      --line:#e6e8f0;
      --bg:#ffffff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:var(--bg);
      color:var(--ink);
      font-family: ui-sans-system, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      min-height:100svh;
      display:flex;
      flex-direction:column;
    }
    main{
      flex:1;
      width:100%;
      max-width:1120px;
      margin:0 auto;
      padding:clamp(20px,5vw,56px) clamp(18px,4vw,40px) 24px;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
    }
    .logo{
      width:100%;
      max-width:1020px;
      height:auto;
      display:block;
      user-select:none;
    }
    .rule{
      width:56px;height:3px;border-radius:999px;
      background:var(--navy);
      margin:clamp(18px,3vw,28px) auto 18px;
      opacity:.9;
    }
    .eyebrow{
      /* Pixel font matching the "]games_" wordmark in the logo */
      font-family: "Silkscreen", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing:.04em;
      text-transform:uppercase;
      font-size:14px;
      font-weight:700;
      color:var(--navy);
      margin:0 0 14px;
    }
    h1{
      /* Blackletter matching the "Consequence" wordmark in the logo */
      font-family: "Grenze Gotisch", "UnifrakturMaguntia", Georgia, serif;
      font-size:clamp(48px,7.5vw,84px);
      line-height:1.02;
      letter-spacing:0;
      margin:0;
      color:var(--navy-dark);
      font-weight:700;
    }
    .lede{
      margin:18px auto 0;
      max-width:620px;
      font-size:clamp(17px,2.2vw,20px);
      line-height:1.55;
      color:var(--muted);
    }
    .lede strong{color:var(--ink);font-weight:650}
    .status{
      margin-top:28px;
      display:inline-flex;
      align-items:center;
      gap:9px;
      border:1px solid var(--line);
      border-radius:999px;
      padding:9px 14px 9px 12px;
      font-family: "Silkscreen", ui-monospace, monospace;
      font-size:13px;
      font-weight:400;
      color:var(--navy-dark);
      background:#fbfbfe;
    }
    .dot{
      width:9px;height:9px;border-radius:50%;
      background:var(--navy);
      box-shadow:0 0 0 0 rgba(27,42,107,.35);
      animation:pulse 2.2s infinite;
      flex:none;
    }
    @keyframes pulse{
      0%{box-shadow:0 0 0 0 rgba(27,42,107,.28)}
      70%{box-shadow:0 0 0 9px rgba(27,42,107,0)}
      100%{box-shadow:0 0 0 0 rgba(27,42,107,0)}
    }
    @media (prefers-reduced-motion: reduce){
      .dot{animation:none}
    }
    footer{
      border-top:1px solid var(--line);
      padding:18px 20px 22px;
      text-align:center;
      color:var(--muted);
      font-size:13.5px;
      line-height:1.5;
    }
    footer a{color:var(--navy);text-decoration:none;font-weight:600}
    footer a:hover{text-decoration:underline}

    .prose{
      width:100%;
      max-width:640px;
      margin:36px auto 0;
      text-align:left;
      font-size:17.5px;
      line-height:1.65;
      color:var(--ink);
    }
    .prose h2{
      font-family: "Grenze Gotisch", "UnifrakturMaguntia", Georgia, serif;
      font-size:clamp(32px,4.5vw,42px);
      line-height:1.05;
      color:var(--navy-dark);
      font-weight:700;
      margin:44px 0 14px;
    }
    .prose h2:first-child{margin-top:0}
    .prose p{margin:0 0 16px}
    .prose ul{margin:0 0 16px;padding-left:1.2em}
    .prose li{margin:0 0 6px}
    .prose a{color:var(--navy);font-weight:600}
    .sig{
      font-family: "Silkscreen", ui-monospace, monospace;
      font-size:13px;
      color:var(--navy);
      margin-top:8px;
    }
    label{display:block;font-weight:600;font-size:15px;margin:0 0 6px;color:var(--ink)}
    input, textarea{
      width:100%;
      font:inherit;
      font-size:16px;
      color:var(--ink);
      border:1px solid #cfd3e0;
      border-radius:6px;
      padding:11px 12px;
      background:#fff;
    }
    input:focus, textarea:focus{outline:2px solid var(--navy);outline-offset:1px;border-color:var(--navy)}
    textarea{min-height:170px;resize:vertical}
    .field{margin:0 0 18px}
    .hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
    button.send{
      font-family: "Silkscreen", ui-monospace, monospace;
      font-size:15px;
      background:var(--navy);
      color:#fff;
      border:0;
      border-radius:6px;
      padding:13px 22px;
      min-height:44px;
      cursor:pointer;
    }
    button.send:hover{background:var(--navy-dark)}
    button.send:disabled{opacity:.6;cursor:wait}
    .status-msg{margin-top:14px;min-height:1.5em;font-size:15.5px}
    .status-msg.ok{color:#1f6b3a}
    .status-msg.err{color:#a3252f}
  </style>
</head>
<body>
  <main>
    <a href="/" aria-label="Consequence Games home"><img class="logo" src="/consequence_banner.png" alt="Consequence Games, a giant die falling toward two startled adventurers opening a treasure chest" width="3603" height="1381"></a>
    <div class="rule" aria-hidden="true"></div>
    <p class="eyebrow">Contact</p>
    <h1>Send a message.</h1>
    <div class="prose">
      <p>Bug reports, ideas, high scores you don't believe, or anything else. I read everything.</p>
      <p>Email me at <a id="mail" href="#">dnellis74 [at] gmail [dot] com</a></p>
      <script>
      // Address is assembled at runtime so it is not sitting in the HTML for scrapers.
      (function () {
        var u = ['dnellis', '74'].join(''), d = ['gmail', 'com'].join('.');
        var a = document.getElementById('mail');
        a.href = 'mailto:' + u + '@' + d + '?subject=' + encodeURIComponent('consequence.games');
        a.textContent = u + '@' + d;
      })();
      </script>
      <!-- TODO: contact form is wired to /api/contact (Resend) but disabled until
           RESEND_API_KEY and CONTACT_TO are set in Vercel. To enable, remove the
           `hidden` attribute below and drop the mailto paragraph above. -->
      <form id="contact" novalidate hidden>
        <div class="field">
          <label for="name">Name <span style="font-weight:400;color:var(--muted)">(optional)</span></label>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="100">
        </div>
        <div class="field">
          <label for="email">Your email</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="200" required>
        </div>
        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" maxlength="5000" required></textarea>
        </div>
        <div class="hp" aria-hidden="true">
          <label for="website">Leave this empty</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>
        <button class="send" type="submit">Send</button>
        <p class="status-msg" id="status" role="status" aria-live="polite"></p>
      </form>
    </div>
    <script>
    (function () {
      var form = document.getElementById('contact');
      var status = document.getElementById('status');
      var btn = form.querySelector('button.send');
      function show(msg, ok) {
        status.textContent = msg;
        status.className = 'status-msg ' + (ok ? 'ok' : 'err');
      }
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var data = {
          name: form.name.value,
          email: form.email.value,
          message: form.message.value,
          website: form.website.value
        };
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email.trim())) { show('Please enter a valid email address.', false); form.email.focus(); return; }
        if (data.message.trim().length < 2) { show('Please write a message.', false); form.message.focus(); return; }
        btn.disabled = true;
        show('Sending...', true);
        fetch('/api/contact', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        }).then(function (r) {
          return r.json().catch(function () { return { ok: false }; }).then(function (j) { return { r: r, j: j }; });
        }).then(function (x) {
          if (x.r.ok && x.j.ok) {
            form.reset();
            show('Sent. Thanks for writing.', true);
          } else {
            show(x.j.error || 'Could not send right now. Please try again later.', false);
          }
        }).catch(function () {
          show('Could not send right now. Please try again later.', false);
        }).then(function () { btn.disabled = false; });
      });
    })();
    </script>
  </main>
  <footer>
    <a href="/">Games</a> &middot; <a href="/about">About</a> &middot; <a href="/links">Links</a> &middot; <a href="/contact">Contact</a> &middot; &copy; 2026 Consequence Games
  </footer>
</body>
</html>
