<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About · Consequence Games</title>
  <meta name="description" content="Consequence Games is coming soon. Games where choices matter, and the dice fall where they may.">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://consequence.games/about">
  <meta property="og:title" content="Consequence Games">
  <meta property="og:description" content="Coming soon. Games where choices matter, and the dice fall where they may.">
  <meta property="og:image" content="https://consequence.games/consequence_banner.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Consequence Games">
  <meta name="twitter:description" content="Coming soon. Games where choices matter, and the dice fall where they may.">
  <meta name="twitter:image" content="https://consequence.games/consequence_banner.png">
  <meta name="theme-color" content="#1b2a6b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;700;800&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#1b2a6b;
      --navy-dark:#121e4f;
      --ink:#1a1d2e;
      --muted:#5a6076;
      --line:#e6e8f0;
      --bg:#ffffff;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      background:var(--bg);
      color:var(--ink);
      font-family: ui-sans-system, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing:antialiased;
      min-height:100svh;
      display:flex;
      flex-direction:column;
    }
    main{
      flex:1;
      width:100%;
      max-width:1120px;
      margin:0 auto;
      padding:clamp(20px,5vw,56px) clamp(18px,4vw,40px) 24px;
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
    }
    .logo{
      width:100%;
      max-width:1020px;
      height:auto;
      display:block;
      user-select:none;
    }
    .rule{
      width:56px;height:3px;border-radius:999px;
      background:var(--navy);
      margin:clamp(18px,3vw,28px) auto 18px;
      opacity:.9;
    }
    .eyebrow{
      /* Pixel font matching the "]games_" wordmark in the logo */
      font-family: "Silkscreen", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing:.04em;
      text-transform:uppercase;
      font-size:14px;
      font-weight:700;
      color:var(--navy);
      margin:0 0 14px;
    }
    h1{
      /* Blackletter matching the "Consequence" wordmark in the logo */
      font-family: "Grenze Gotisch", "UnifrakturMaguntia", Georgia, serif;
      font-size:clamp(48px,7.5vw,84px);
      line-height:1.02;
      letter-spacing:0;
      margin:0;
      color:var(--navy-dark);
      font-weight:700;
    }
    .lede{
      margin:18px auto 0;
      max-width:620px;
      font-size:clamp(17px,2.2vw,20px);
      line-height:1.55;
      color:var(--muted);
    }
    .lede strong{color:var(--ink);font-weight:650}
    .status{
      margin-top:28px;
      display:inline-flex;
      align-items:center;
      gap:9px;
      border:1px solid var(--line);
      border-radius:999px;
      padding:9px 14px 9px 12px;
      font-family: "Silkscreen", ui-monospace, monospace;
      font-size:13px;
      font-weight:400;
      color:var(--navy-dark);
      background:#fbfbfe;
    }
    .dot{
      width:9px;height:9px;border-radius:50%;
      background:var(--navy);
      box-shadow:0 0 0 0 rgba(27,42,107,.35);
      animation:pulse 2.2s infinite;
      flex:none;
    }
    @keyframes pulse{
      0%{box-shadow:0 0 0 0 rgba(27,42,107,.28)}
      70%{box-shadow:0 0 0 9px rgba(27,42,107,0)}
      100%{box-shadow:0 0 0 0 rgba(27,42,107,0)}
    }
    @media (prefers-reduced-motion: reduce){
      .dot{animation:none}
    }
    footer{
      border-top:1px solid var(--line);
      padding:18px 20px 22px;
      text-align:center;
      color:var(--muted);
      font-size:13.5px;
      line-height:1.5;
    }
    footer a{color:var(--navy);text-decoration:none;font-weight:600}
    footer a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <main>
    <a href="/" aria-label="Consequence Games home"><img class="logo" src="/consequence_banner.png" alt="Consequence Games — a giant die falling toward two startled adventurers opening a treasure chest" width="3603" height="1381"></a>
    <div class="rule" aria-hidden="true"></div>
    <p class="eyebrow">Coming soon</p>
    <h1>Something is about<br>to fall.</h1>
    <p class="lede">We&rsquo;re building <strong>games where choices matter</strong> &mdash; and the dice fall where they may. First title in the works. Check back soon.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span> In development &middot; consequence.games</div>
  </main>
  <footer>
    <a href="/">Games</a> &middot; <a href="/about">About</a> &middot; &copy; 2026 Consequence Games
  </footer>
</body>
</html>
